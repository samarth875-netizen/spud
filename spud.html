spud! bounce it<br><canvas id=c width=300 height=400 style=border:solid;width:96vw;height:90vh></canvas><script>
// short names save bytes for the 1KB limit
let g=c.getContext('2d'),px=150,py=40,vx=2.5,vy=4,s=12,bar=120,score=0,over=0
c.onmousemove=e=>bar=e.offsetX*300/c.clientWidth-22
onkeydown=e=>bar+=(e.keyCode-38)*12
c.onclick=()=>over&&(px=150,py=40,vx=2.5,vy=4,s=12,score=0,over=0,bar=120)
setInterval(()=>{
if(over)return
g.clearRect(0,0,300,400)
px+=vx
py+=vy
if(px<10||px>290)vx*=-1
if(py<10)vy*=-1
// bounce on bar
if(vy>0 && py>362-s && py<375 && px>bar-5 && px<bar+49){vy=-vy-.15;s+=1;score++}
if(py>400)over=1
if(bar<0)bar=0
if(bar>256)bar=256
g.fillRect(bar,370,44,8)
g.fillStyle='#b70'
g.beginPath()
g.ellipse(px,py,s,s+6,.4,0,7)
g.fill()
g.beginPath()
g.ellipse(px+5,py-4,s*.6,s*.6,0,0,7)
g.fill()
g.fillStyle='#000'
g.fillRect(px-4,py-2,2,2)
g.fillRect(px+2,py,2,2)
g.fillRect(px-1,py+4,3,2)
g.fillText('s:'+score,10,20)
if(over)g.fillText('miss! click',115,200)
},30)
</script>
